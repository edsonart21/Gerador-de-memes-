<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Memes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
      color: #00adb5;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    @media (min-width: 768px) {
      .container {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .canvas-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #2b2d42;
      border-radius: 8px;
      padding: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      cursor: move;
      touch-action: none; /* Melhora a interação por toque no mobile */
    }

    .controls-area {
      flex: 1;
      background-color: #2b2d42;
      padding: 20px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #dfdfdf;
    }

    input[type="text"], input[type="file"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: #393e46;
      color: #fff;
      font-size: 1rem;
    }

    .range-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: #00adb5;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #008c93;
    }

    .btn-secondary {
      background-color: #393e46;
      color: #fff;
    }

    .btn-secondary:hover {
      background-color: #4f5660;
    }

    .btn-danger {
      background-color: #d9534f;
      color: #fff;
    }

    .btn-danger:hover {
      background-color: #c9302c;
    }
  </style>
</head>
<body>

  <h1>Gerador de Memes</h1>

  <div class="container">
    <div class="canvas-area">
      <canvas id="memeCanvas"></canvas>
    </div>

    <div class="controls-area">
      <div class="control-group">
        <label for="imageInput">Carregar Imagem</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <div class="control-group">
        <label>Predefinições Clássicas</label>
        <div class="btn-grid">
          <button class="btn-secondary" onclick="loadPreset('drake')">Drake</button>
          <button class="btn-secondary" onclick="loadPreset('distracted')">Namorado Distraído</button>
        </div>
      </div>

      <div class="control-group">
        <label for="topTextInput">Texto Superior (Arraste no Canvas)</label>
        <input type="text" id="topTextInput" placeholder="Texto de cima..." value="TEXTO SUPERIOR">
      </div>

      <div class="control-group">
        <label for="bottomTextInput">Texto Inferior (Arraste no Canvas)</label>
        <input type="text" id="bottomTextInput" placeholder="Texto de baixo..." value="TEXTO INFERIOR">
      </div>

      <div class="control-group">
        <label for="fontSizeInput">Tamanho da Fonte: <span id="fontSizeVal">40</span>px</label>
        <div class="range-group">
          <input type="range" id="fontSizeInput" min="15" max="100" value="40">
        </div>
      </div>

      <div class="control-group">
        <label for="strokeWidthInput">Espessura do Contorno: <span id="strokeWidthVal">6</span>px</label>
        <div class="range-group">
          <input type="range" id="strokeWidthInput" min="0" max="20" value="6">
        </div>
      </div>

      <div class="btn-grid" style="margin-top: 10px;">
        <button class="btn-danger" id="resetBtn">Redefinir</button>
        <button class="btn-primary" id="downloadBtn">Baixar Meme</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');

    const imageInput = document.getElementById('imageInput');
    const topTextInput = document.getElementById('topTextInput');
    const bottomTextInput = document.getElementById('bottomTextInput');
    const fontSizeInput = document.getElementById('fontSizeInput');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const strokeWidthInput = document.getElementById('strokeWidthInput');
    const strokeWidthVal = document.getElementById('strokeWidthVal');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let img = new Image();
    let isDragging = false;
    let selectedText = null;

    // Configuração inicial dos textos
    const textState = {
      top: { text: '', x: 0, y: 0 },
      bottom: { text: '', x: 0, y: 0 },
      fontSize: 40,
      strokeWidth: 6
    };

    // Predefinições
    const presets = {
      drake: 'https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/drake-hotline-bling-meme-format-blank-t-shirt-alain-d-art.jpg',
      distracted: 'https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/distracted-boyfriend-meme-blank-format-alain-d-art.jpg'
    };

    function initCanvas() {
      // Carrega uma imagem inicial em branco com resolução padrão
      canvas.width = 600;
      canvas.height = 600;
      textState.top.x = canvas.width / 2;
      textState.top.y = 60;
      textState.bottom.x = canvas.width / 2;
      textState.bottom.y = canvas.height - 40;
      drawMeme();
    }

    function drawMeme() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (img.src && img.complete) {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#666';
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Escolha ou carregue uma imagem', canvas.width / 2, canvas.height / 2);
      }

      // Estilização do texto do Meme
      ctx.fillStyle = 'white';
      ctx.strokeStyle = 'black';
      ctx.lineWidth = textState.strokeWidth;
      ctx.font = `900 ${textState.fontSize}px Impact, Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineJoin = 'round';

      // Desenhar Texto Superior
      if (textState.top.text) {
        if (textState.strokeWidth > 0) {
          ctx.strokeText(textState.top.text, textState.top.x, textState.top.y);
        }
        ctx.fillText(textState.top.text, textState.top.x, textState.top.y);
      }

      // Desenhar Texto Inferior
      if (textState.bottom.text) {
        if (textState.strokeWidth > 0) {
          ctx.strokeText(textState.bottom.text, textState.bottom.x, textState.bottom.y);
        }
        ctx.fillText(textState.bottom.text, textState.bottom.x, textState.bottom.y);
      }
    }

    function loadImageSrc(src) {
      img = new Image();
      img.crossOrigin = 'anonymous'; // Evita erro de CORS ao exportar
      img.onload = () => {
        // Redimensiona o canvas para ajustar a proporção da imagem (com limite de largura)
        const maxWidth = 800;
        let scale = Math.min(1, maxWidth / img.width);
        
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;

        // Reposiciona o texto proporcionalmente
        textState.top.x = canvas.width / 2;
        textState.top.y = canvas.height * 0.12;
        textState.bottom.x = canvas.width / 2;
        textState.bottom.y = canvas.height * 0.90;

        drawMeme();
      };
      img.src = src;
    }

    // Gerenciamento de eventos para Arrastar e Soltar (Desktop e Mobile)
    function getEventPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function isPointerOverText(pos, textKey) {
      const text = textState[textKey].text;
      if (!text) return false;

      const x = textState[textKey].x;
      const y = textState[textKey].y;
      
      ctx.font = `900 ${textState.fontSize}px Impact, Arial, sans-serif`;
      const metrics = ctx.measureText(text);
      const width = metrics.width;
      const height = textState.fontSize;

      return (
        pos.x >= x - width / 2 &&
        pos.x <= x + width / 2 &&
        pos.y >= y - height &&
        pos.y <= y
      );
    }

    function startDrag(e) {
      const pos = getEventPos(e);

      if (isPointerOverText(pos, 'top')) {
        selectedText = 'top';
        isDragging = true;
      } else if (isPointerOverText(pos, 'bottom')) {
        selectedText = 'bottom';
        isDragging = true;
      }
    }

    function drag(e) {
      if (!isDragging || !selectedText) return;
      e.preventDefault();

      const pos = getEventPos(e);
      textState[selectedText].x = pos.x;
      textState[selectedText].y = pos.y;
      drawMeme();
    }

    function stopDrag() {
      isDragging = false;
      selectedText = null;
    }

    // Eventos do Canvas
    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', drag);
    canvas.addEventListener('mouseup', stopDrag);

    canvas.addEventListener('touchstart', startDrag, { passive: false });
    canvas.addEventListener('touchmove', drag, { passive: false });
    canvas.addEventListener('touchend', stopDrag);

    // Eventos dos Controles
    topTextInput.addEventListener('input', (e) => {
      textState.top.text = e.target.value.toUpperCase();
      drawMeme();
    });

    bottomTextInput.addEventListener('input', (e) => {
      textState.bottom.text = e.target.value.toUpperCase();
      drawMeme();
    });

    fontSizeInput.addEventListener('input', (e) => {
      textState.fontSize = parseInt(e.target.value);
      fontSizeVal.textContent = textState.fontSize;
      drawMeme();
    });

    strokeWidthInput.addEventListener('input', (e) => {
      textState.strokeWidth = parseInt(e.target.value);
      strokeWidthVal.textContent = textState.strokeWidth;
      drawMeme();
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => loadImageSrc(event.target.result);
        reader.readAsDataURL(file);
      }
    });

    function loadPreset(key) {
      if (presets[key]) {
        loadImageSrc(presets[key]);
      }
    }

    // Botão Redefinir
    resetBtn.addEventListener('click', () => {
      topTextInput.value = 'TEXTO SUPERIOR';
      bottomTextInput.value = 'TEXTO INFERIOR';
      fontSizeInput.value = 40;
      strokeWidthInput.value = 6;
      fontSizeVal.textContent = 40;
      strokeWidthVal.textContent = 6;

      textState.top.text = 'TEXTO SUPERIOR';
      textState.bottom.text = 'TEXTO INFERIOR';
      textState.fontSize = 40;
      textState.strokeWidth = 6;

      if (img.src) {
        textState.top.x = canvas.width / 2;
        textState.top.y = canvas.height * 0.12;
        textState.bottom.x = canvas.width / 2;
        textState.bottom.y = canvas.height * 0.90;
      }

      drawMeme();
    });

    // Botão Baixar
    downloadBtn.addEventListener('click', () => {
      if (!img.src) {
        alert('Por favor, escolha uma imagem primeiro!');
        return;
      }
      const link = document.createElement('a');
      link.download = 'meu-meme.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Inicialização da interface
    textState.top.text = topTextInput.value.toUpperCase();
    textState.bottom.text = bottomTextInput.value.toUpperCase();
    initCanvas();
  </script>
</body>
</html>
